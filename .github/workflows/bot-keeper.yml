name: guardian-del-bot
on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
concurrency:
  group: guardian-del-bot
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python bot-cycle.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEFA_CHAT_ID: '1227661387'
          QVAPAY_APP_ID: ${{ secrets.QVAPAY_APP_ID }}
          QVAPAY_APP_SECRET: ${{ secrets.QVAPAY_APP_SECRET }}
